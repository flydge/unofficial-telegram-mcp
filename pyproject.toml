[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-search-mcp"
dynamic = ["version"]
description = "Unofficial Telegram MCP: read, search, and send messages, files, and voice notes with approval"
requires-python = ">=3.11,<3.15"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
  "mcp==2.2.0",
  "PyMuPDF==1.26.4",
  "python-docx==1.2.0",
  "Pillow==11.3.0",
  "segno==1.6.6",
]

[project.optional-dependencies]
bundled-installer = ["tomlkit==0.13.3"]

[project.urls]
Repository = "https://github.com/flydge/unofficial-telegram-mcp"
Documentation = "https://github.com/flydge/unofficial-telegram-mcp#readme"
Changelog = "https://github.com/flydge/unofficial-telegram-mcp/blob/main/CHANGELOG.md"
Roadmap = "https://github.com/flydge/unofficial-telegram-mcp/blob/main/docs/roadmap.md"

[project.scripts]
telegram-search-mcp = "telegram_search_mcp.server:main"
telegram-search-broker = "telegram_search_mcp.launch_agent:main"
telegram-search-transfer = "telegram_search_mcp.transfer_cli:main"
telegram-search-setup = "telegram_search_mcp.setup_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "telegram_search_mcp.__version__"}

[tool.setuptools.data-files]
"share/telegram-search-mcp" = ["README.md", "LICENSE", "NOTICE"]
"share/telegram-search-mcp/docs" = ["docs/security.md", "docs/release-preflight.md", "docs/install.md", "docs/reference.md", "docs/release-notes-0.51.0.md", "docs/release-notes-0.52.0.md", "docs/release-notes-0.53.0rc1.md", "docs/release-notes-0.53.0rc2.md", "docs/release-notes-0.54.0rc1.md", "docs/release-notes-0.55.0rc1.md", "docs/release-notes-0.56.0rc1.md", "docs/release-notes-0.57.0rc1.md", "docs/release-notes-0.58.0rc1.md", "docs/release-notes-0.59.0rc1.md", "docs/third-party-notices.md", "docs/licensing.md", "docs/roadmap.md", "docs/releasing.md", "docs/tdlib-upgrade.md"]
"share/telegram-search-mcp/docs/plans" = ["docs/plans/initial-roadmap.md"]
"share/telegram-search-mcp/docs/licenses" = ["docs/licenses/mcp-MIT.txt", "docs/licenses/python-docx-MIT.txt", "docs/licenses/Pillow.txt", "docs/licenses/PyMuPDF-COPYING.txt", "docs/licenses/segno-BSD.txt"]
"share/telegram-search-mcp/docs/assets" = ["docs/assets/unofficial-telegram-mcp-header.png"]
"share/telegram-search-mcp/.codex" = [".codex/config.toml.example"]
"share/telegram-search-mcp/skills/telegram-search" = ["skills/telegram-search/SKILL.md"]
"share/telegram-search-mcp/skills/telegram-setup" = ["skills/telegram-setup/SKILL.md"]
"share/telegram-search-mcp/packaging" = ["packaging/bootstrap.sh", "packaging/bootstrap_verifier.c", "packaging/build_bootstrap_seed.sh", "packaging/launcher.py", "packaging/assemble_bundle.py", "packaging/tdlib-lock.json", "packaging/release_gate.py", "packaging/constraints-0.59.0.txt"]
"share/telegram-search-mcp/packaging/inspector" = ["packaging/inspector/package.json", "packaging/inspector/package-lock.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
